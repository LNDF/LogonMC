# LogonMC configuration
# Changes to database settings need a proxy restart; everything else applies on /logonmc reload.

database:
  # H2, SQLITE or MYSQL (also works for MariaDB)
  type: H2
  mysql:
    host: localhost
    port: 3306
    database: logonmc
    user: root
    password: ""
    properties: "useSSL=false&characterEncoding=utf8&allowPublicKeyRetrieval=true"
  pool-size: 10

servers:
  # Server (from velocity.toml) unauthenticated players are held on, e.g. a NanoLimbo instance.
  auth: limbo
  # Servers tried in order once a player is authenticated.
  lobby:
    - lobby
  # Send returning players to the server they last played on instead of the lobby.
  remember-last-server: true

auth:
  login-timeout-seconds: 60
  # Wrong passwords per connection before the player is kicked.
  max-attempts: 5
  wrong-password-delay-millis: 1000
  # Wrong passwords counted across reconnects. At a limit, password logins from that IP or to that
  # account are refused until lockout-minutes pass without another wrong one. 0 disables a limit.
  # The account limit stops attackers with many IPs, but lets anyone lock an account out on purpose.
  lockout:
    max-failures-per-ip: 10
    max-failures-per-account: 20
    lockout-minutes: 15
  password-min-length: 6
  password-max-length: 64
  # ARGON2ID (recommended) or BCRYPT. Existing hashes of the other type are upgraded on login.
  hash-algorithm: ARGON2ID
  # Threads for password hashing; each Argon2id hash uses 19 MiB. 0 uses one per CPU core.
  hash-threads: 0
  # Password checks that may wait for a thread; beyond this, players are told to try again.
  hash-queue-size: 256
  # Commands unauthenticated players may run. Everything else (proxy and backend) is blocked.
  allowed-commands: [login, l, log, register, reg]
  reminder-interval-seconds: 10
  # A boss bar that drains over login-timeout-seconds while a player hasn't logged in yet.
  # Text: prompt.boss-bar-login / prompt.boss-bar-register in messages.yml.
  boss-bar:
    enabled: true
    # PINK, BLUE, RED, GREEN, YELLOW, PURPLE or WHITE
    color: YELLOW
    # PROGRESS (solid), NOTCHED_6, NOTCHED_10, NOTCHED_12 or NOTCHED_20
    overlay: PROGRESS
  # Refuse passwords listed in the .txt files of plugins/logonmc/unsafe_lists/, one password per
  # line (e.g. leaked-password lists). On first start the folder gets a short Minecraft-flavored
  # list and the 10,000 most common passwords from SecLists.
  # Applies to /register and /changepassword. Lists are reloaded with /logonmc reload.
  unsafe-passwords:
    enabled: true
    # false also refuses other capitalizations of a listed password ("PassWord1" for "password1").
    case-sensitive: false

session:
  # Rejoining from the same IP within duration-minutes of a password login skips the prompt.
  # The IP is the only proof, so anyone sharing it (household, school, VPN, mobile carrier) can
  # join with the player's name. Behind TCPShield, playit.gg, HAProxy or similar, enable PROXY
  # protocol (haproxy-protocol in velocity.toml), or every player shares the proxy's IP.
  enabled: true
  duration-minutes: 30

names:
  # Usernames that don't match are refused.
  pattern: "^[A-Za-z0-9_]{3,16}$"
  # Refuse a join whose name matches an existing account or a premium account with different
  # capitalization (e.g. "steve" when "Steve" exists), so one name can't become two accounts.
  case-check: true

premium:
  # Every player registers with a password, premium or not. A player who owns the Mojang account of
  # their name can then run /premium <password> to link it: from then on they join through Mojang
  # authentication, log in without a password, and keep their account when they change their name.
  # Accounts that aren't linked are cracked accounts, even if their name is premium.
  #
  # Whether a cracked player can register a premium name that no account here has claimed yet.
  #   true  - no. Registering it requires joining once through Mojang authentication, so only the
  #           owner of that Mojang account can claim the name (they still register a password).
  #   false - yes. The first player to /register the name gets it.
  # Names already registered here always stay with their account, and the current name of a linked
  # account is always protected.
  protect-premium-names: true
  # When an account is linked with /premium, also switch its profile UUID to the Mojang UUID and
  # fire PremiumMigrationEvent so other plugins can move data.
  # false keeps the old UUID, so all data on backend servers stays attached to the player.
  switch-uuid-on-premium: false
  # After a cracked account logs in, tell the player if their name belongs to a Mojang account that
  # isn't linked yet, and that /premium <password> enables automatic login.
  suggest-premium: true
  # If the Mojang API can't be reached, refuse joins of unregistered names instead of letting
  # them in as cracked, where someone could register a premium name.
  deny-on-mojang-error: true
  mojang-cache-minutes: 10
  # Mojang lookups that joins with new names from one IP (IPv6: one /64) may cause, so one client
  # can't get the proxy rate limited by Mojang. Joins over the limit are refused. 0 disables it.
  lookup-limit:
    max-lookups-per-ip: 10
    window-minutes: 10
  # IPs of this machine to send Mojang lookups from, in rotation; Mojang rate limits per IP.
  # Empty uses the default route. Example: [203.0.113.10, 203.0.113.11]
  lookup-addresses: []
  # URLs tried in order when Mojang fails on every address, with {name} for the player name. They
  # must answer like https://api.mojang.com/users/profiles/minecraft/<name>, and decide which
  # names count as premium, so only use services you trust.
  # Example: ["https://mojang-mirror.example.com/users/profiles/minecraft/{name}"]
  lookup-proxies: []
