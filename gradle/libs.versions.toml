[versions]
velocity = "4.3.0"
hikari = "7.1.0"
mysql = "26.10.0"
sqlite = "3.53.4.0"
h2 = "2.5.252"
bouncycastle = "1.86"
bcrypt = "0.10.2"
junit = "6.1.3"
shadow = "9.6.1"
maven-publish = "0.37.0"

[libraries]
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
