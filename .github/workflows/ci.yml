name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build :api:javadoc --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: plugin/build/reports/tests/

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: LogonMC
          path: |
            plugin/build/libs/LogonMC-*.jar
            !plugin/build/libs/*-sources.jar
          if-no-files-found: error
